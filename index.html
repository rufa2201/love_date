<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Свидание ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}


.box{
    background:white;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
    animation:show 1s;
}


h1{
    color:#ff4f81;
}


p{
    font-size:22px;
}


button{
    border:none;
    background:#ff4f81;
    color:white;
    padding:15px 30px;
    margin:10px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}


button:hover{
    transform:scale(1.1);
}


.heart{
    position:absolute;
    color:white;
    font-size:25px;
    animation:fall linear infinite;
}


@keyframes fall{

0%{
transform:translateY(-100px);
opacity:1;
}

100%{
transform:translateY(100vh);
opacity:0;
}

}


@keyframes show{

from{
transform:scale(.5);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}


</style>

</head>


<body>


<div class="box">

<h1 id="title">
Есть один вопрос ❤️
</h1>


<p id="question">
Ты пойдешь со мной на свидание?
</p>


<div id="buttons">

<button id="no" onclick="no()">
Нет 😢
</button>


<button onclick="yes()">
Да ❤️
</button>

</div>


<p id="message"></p>


</div>



<script>


let step=1;



// сердечки

setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"%";

heart.style.animationDuration=
(Math.random()*3+3)+"s";


document.body.appendChild(heart);


setTimeout(()=>{
heart.remove();
},5000);


},300);





function no(){


if(step==1){

document.getElementById("message").innerHTML=
"Ой 😳 ошибка... ты должна была нажать ДА ❤️";

}


else if(step==3){

document.getElementById("message").innerHTML=
"Ой 😅 кнопка 'не приду' была случайно добавлена 😂<br>Правильный ответ — обязательно приду ❤️";


}

}




function yes(){


if(step==1){


step=2;


document.getElementById("title").innerHTML=
"Урааа ❤️";


document.getElementById("question").innerHTML=
"Куда пойдем?";


document.getElementById("buttons").innerHTML=
`
<button onclick="choose()">
Решаешь ты 😌
</button>

<button onclick="choose()">
Решаю я ❤️
</button>
`;



}



}




function choose(){


step=3;


document.getElementById("question").innerHTML=
"Это свидание решу я 😎❤️<br><br>Жду тебя в 17:00 в парке Кирова 🌹";


document.getElementById("buttons").innerHTML=
`

<button onclick="no()">
Не приду 😈
</button>


<button onclick="finish()">
Хорошо, приду ❤️
</button>

`;


}





function finish(){


document.getElementById("title").innerHTML=
"Урааааа ❤️❤️❤️";


document.getElementById("question").innerHTML=
"Тогда договорились 😌<br><br>Жду тебя 🌹";


document.getElementById("buttons").innerHTML="";


document.getElementById("message").innerHTML=
"Самая красивая встреча впереди ❤️";


}



</script>


</body>
</html>
